services:
  - type: web
    name: aspire
    runtime: python
    plan: free
    # Trains the ML model during build so the first request is fast
    buildCommand: pip install -r requirements.txt && python backend/ml/train.py
    # 1 worker: SQLite does not like several writers
    startCommand: cd backend && gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/ping
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ASPIRE_SECRET_KEY
        generateValue: true
      - key: ASPIRE_ADMIN_EMAIL
        value: admin@rbu.ac.in
      - key: ASPIRE_ADMIN_PASSWORD
        sync: false   # Render asks you for this on first deploy
      - key: FLASK_DEBUG
        value: "0"
